<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>oxn dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --fg: #14161c; --muted: #5d6475;
  --line: #e1e4ea; --line-strong: #cdd2db; --accent: #4f5bd5; --accent-fg: #ffffff;
  --focus: #4f5bd5; --danger: #c93a3a; --danger-text: #a51d1d; --danger-bg: #fdeeee; --ok: #1f8a4c; --warn: #8a5300;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.08);
  --s-waiting: #2f6fdd; --s-active: #c27c0e; --s-completed: #1f8a4c; --s-failed: #c93a3a;
  --s-delayed: #7b4fd1; --s-prioritized: #0f8a8a; --s-paused: #6b7280; --s-waiting-children: #5b6b86;
  --radius: 10px; --side: 264px; --top: 56px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --fg: #e8eaf0; --muted: #9aa1b2;
  --line: #2a2f3a; --line-strong: #3a4150; --accent: #8b95ff; --accent-fg: #0f1115; --focus: #8b95ff;
  --danger: #ff7b7b; --danger-text: #ff9a9a; --danger-bg: #3a1d1f; --ok: #5fd08f; --warn: #f0b860;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --s-waiting: #6aa0ff; --s-active: #f0b860; --s-completed: #5fd08f; --s-failed: #ff7b7b;
  --s-delayed: #b79bff; --s-prioritized: #4fd1d1; --s-paused: #9aa1b2; --s-waiting-children: #9fb0cc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --fg: #e8eaf0; --muted: #9aa1b2;
    --line: #2a2f3a; --line-strong: #3a4150; --accent: #8b95ff; --accent-fg: #0f1115; --focus: #8b95ff;
    --danger: #ff7b7b; --danger-text: #ff9a9a; --danger-bg: #3a1d1f; --ok: #5fd08f; --warn: #f0b860;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --s-waiting: #6aa0ff; --s-active: #f0b860; --s-completed: #5fd08f; --s-failed: #ff7b7b;
    --s-delayed: #b79bff; --s-prioritized: #4fd1d1; --s-paused: #9aa1b2; --s-waiting-children: #9fb0cc;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.skip { position: absolute; left: 8px; top: -40px; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 8px; padding: 0 12px; padding-top: env(safe-area-inset-top); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; margin-right: 4px; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.top .grow { flex: 1; min-width: 0; }
.qpick { display: none; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live[data-state="live"] i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.live[data-state="polling"] i { background: var(--warn); }
.live[data-state="offline"] i { background: var(--danger); }

/* layout */
.layout { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.layout.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.layout.collapsed .side { visibility: hidden; }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 8px 6px; }
.side input { width: 100%; min-height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); margin-bottom: 8px; }
.qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.qbtn { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; }
.qbtn:hover { background: var(--panel-2); }
.qbtn[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.qbtn .n { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbtn .c { font-size: 12px; color: var(--muted); grid-column: 1 / -1; display: flex; gap: 10px; }
.qbtn .c b { font-weight: 560; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); align-self: center; }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.main { min-width: 0; padding: 16px 20px 40px; }
.empty { display: grid; place-items: center; text-align: center; padding: 48px 16px; color: var(--muted); gap: 6px; }
.empty strong { color: var(--fg); font-size: 15px; }

/* queue header */
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
.qhead h1 { font-size: 20px; margin: 0; overflow-wrap: anywhere; }
.qhead .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.qhead .more { display: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tab { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); font-weight: 560; }

/* state chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; margin-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-selected="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }

/* toolbar */
.toolbar { position: sticky; top: var(--top); z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; background: var(--bg); }
.toolbar .search { display: flex; gap: 6px; flex: 1 1 220px; }
.toolbar input, .toolbar select, .field input, .field select, .field textarea { min-height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); }
.toolbar .search input { flex: 1; min-width: 0; }

/* table / cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
table.jobs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.jobs th { text-align: left; font-size: 12px; font-weight: 560; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); white-space: nowrap; }
.jobs td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.jobs tbody tr { cursor: pointer; }
.jobs tbody tr:hover, .jobs tbody tr.sel { background: var(--panel-2); }
.jobs tbody tr:last-child td { border-bottom: 0; }
.jobs .reason { color: var(--danger-text); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobs .id { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.skel td i { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--panel-2), var(--line), var(--panel-2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel td i { animation: none; } * { transition: none !important; } }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.pager .nav { display: flex; gap: 6px; }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,12,18,.36); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 50; background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer header .t { flex: 1; min-width: 0; }
.drawer header h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.drawer .body { overflow: auto; padding: 14px 16px 32px; display: grid; gap: 16px; }
.drawer .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.drawer section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 0 0 6px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
pre.json { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); overflow: auto; max-height: 320px; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.failure { border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--line)); background: var(--danger-bg); border-radius: 8px; padding: 10px 12px; }
.failure p { margin: 0 0 6px; color: var(--danger-text); font-weight: 560; overflow-wrap: anywhere; }
.failure ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.logs { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; display: grid; gap: 4px; }
.logs li { padding: 4px 8px; border-radius: 6px; background: var(--panel-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.tree { list-style: none; margin: 0; padding-left: 0; }
.tree .tree { padding-left: 18px; border-left: 1px dashed var(--line-strong); margin-left: 7px; }
.tree li { margin: 4px 0; }
.tree .node { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.tree .node:hover { background: var(--panel-2); }
.tree .node.me { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg); padding: 0; width: min(480px, calc(100vw - 24px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10,12,18,.45); }
dialog form { display: grid; gap: 12px; padding: 18px; }
dialog h2 { margin: 0; font-size: 17px; }
dialog p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field textarea { min-height: 120px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; }

/* toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
.toast.err { border-left-color: var(--danger); }
.toast span { flex: 1; }

/* sheet (sidebar on small screens) */
@media (max-width: 899px) {
  .layout, .layout.collapsed { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 45; top: var(--top); left: 0; bottom: 0; width: min(320px, 86vw); height: auto; box-shadow: var(--shadow); transform: translateX(-102%); transition: transform .18s ease; visibility: hidden; }
  .layout.open .side { transform: none; visibility: visible; }
  .main { padding: 12px 12px 40px; }
}
@media (max-width: 640px) {
  .brand span { display: none; }
  .qpick { display: inline-flex; flex: 1; min-width: 0; justify-content: space-between; }
  .qpick b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .grow { display: none; }
  .side { top: var(--top); left: 0; right: 0; bottom: auto; width: auto; max-height: 70vh; border-radius: 0 0 14px 14px; transform: translateY(-104%); }
  .layout.open .side { transform: none; }
  #sideToggle { display: none; }
  .qhead .more { display: inline-flex; margin-left: auto; }
  .qhead .actions { margin-left: 0; width: 100%; display: none; }
  .qhead .actions.open { display: flex; }
  .toolbar { top: var(--top); }
  .live b { display: none; }
  /* jobs as cards */
  table.jobs, .jobs tbody, .jobs tr, .jobs td { display: block; width: 100%; }
  .jobs thead { display: none; }
  /* card: id … attempts / name · time · duration / extra */
  .jobs tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 2px; }
  .jobs tbody tr::after { content: ""; order: 1; flex-basis: 100%; height: 0; }
  .jobs td { padding: 0; border: 0; width: auto; }
  .jobs td[data-k="id"] { order: 0; flex: 1 1 auto; min-width: 0; font-weight: 560; }
  .jobs td[data-k="att"] { order: 0; margin-left: auto; padding-left: 8px; white-space: nowrap; color: var(--muted); }
  .jobs td[data-k="name"], .jobs td[data-k="when"], .jobs td[data-k="dur"] { order: 2; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .jobs td[data-k="name"] { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .jobs td[data-k="when"]:not(:empty)::before, .jobs td[data-k="dur"]:not(:empty)::before { content: "\00a0·\00a0"; }
  .jobs td[data-k="extra"] { order: 3; flex-basis: 100%; margin-top: 4px; }
  .jobs td:empty { display: none; }
  .jobs .reason { max-width: none; white-space: normal; }
  .drawer { width: 100vw; border-left: 0; }
  .toasts { left: 16px; right: 16px; width: auto; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <button class="btn icon ghost" id="sideToggle" aria-label="Show queues" aria-controls="side" aria-expanded="false"></button>
  <div class="brand"><div class="dot" aria-hidden="true"></div><span>oxn</span></div>
  <button class="btn qpick" id="qpick" aria-controls="side" aria-expanded="false"><b id="qpickName">Queues</b></button>
  <div class="grow"></div>
  <span class="live" id="live" data-state="offline" role="status" aria-live="polite"><i aria-hidden="true"></i><b id="liveText">Connecting</b></span>
  <button class="btn icon ghost" id="refreshBtn" aria-label="Refresh (r)"></button>
  <button class="btn icon ghost" id="themeBtn" aria-label="Theme"></button>
  <button class="btn icon ghost" id="keyBtn" aria-label="API token"></button>
</header>
<div class="layout" id="layout">
  <nav class="side" id="side" aria-label="Queues">
    <h2 id="qh">Queues</h2>
    <label class="sr" for="qfilter">Filter queues</label>
    <input id="qfilter" type="search" placeholder="Filter queues" autocomplete="off">
    <ul class="qlist" id="qlist" aria-labelledby="qh"></ul>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="drawerHost"></div>
<div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

<dialog id="confirmDlg" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div id="confirmExtra"></div>
    <div class="row">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn danger" value="ok" id="confirmOk">Confirm</button>
    </div>
  </form>
</dialog>
<dialog id="addDlg" aria-labelledby="addTitle">
  <form method="dialog" id="addForm">
    <h2 id="addTitle">Add job</h2>
    <div class="field"><label for="addName">Name (optional)</label><input id="addName" autocomplete="off"></div>
    <div class="field"><label for="addData">Data (JSON)</label><textarea id="addData" spellcheck="false">{}</textarea></div>
    <div class="field"><label for="addOpts">Options (JSON, optional)</label><textarea id="addOpts" spellcheck="false" placeholder='{"attempts": 3, "delay_ms": 0, "priority": 0}'></textarea></div>
    <p id="addErr" role="alert"></p>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Add job</button></div>
  </form>
</dialog>
<dialog id="tokenDlg" aria-labelledby="tokenTitle">
  <form method="dialog" id="tokenForm">
    <h2 id="tokenTitle">API token</h2>
    <p>This API asks for a bearer token. It is kept in this browser tab only, unless you choose to remember it.</p>
    <div class="field"><label for="tokenIn">Token</label><input id="tokenIn" type="password" autocomplete="current-password"></div>
    <label class="check"><input type="checkbox" id="tokenRemember"> Remember on this device</label>
    <div class="row"><button class="btn" value="clear" id="tokenClear" formnovalidate>Sign out</button><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Use token</button></div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

    function dashboardBase(pathname) {
      return pathname.replace(/\/+$/, '');
    }

  var STATES = ['waiting', 'active', 'delayed', 'prioritized', 'waiting-children', 'paused', 'completed', 'failed'];
  var LABEL = { 'waiting': 'Waiting', 'active': 'Active', 'delayed': 'Delayed', 'prioritized': 'Prioritized', 'waiting-children': 'Waiting for children', 'paused': 'Paused', 'completed': 'Completed', 'failed': 'Failed' };
  var COUNT_KEY = { 'waiting-children': 'waiting_children' };
  var CLEANABLE = ['completed', 'failed', 'delayed', 'prioritized', 'waiting-children'];

  var S = {
    base: dashboardBase(window.location.pathname),
    token: read('session', 'oxn.token') || read('local', 'oxn.token'),
    access: null, queues: [], filter: '', queue: null, tab: 'jobs',
    state: 'waiting', offset: 0, limit: 25, order: 'asc', page: null, loading: false, error: null,
    job: null, jobData: null, sel: -1, live: 'offline', events: null, lastFocus: null
  };

  // ---------------------------------------------------------------- utils
  function read(kind, k) { try { return (kind === 'local' ? localStorage : sessionStorage).getItem(k); } catch (e) { return null; } }
  function write(kind, k, v) { try { var s = kind === 'local' ? localStorage : sessionStorage; if (v == null) s.removeItem(k); else s.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    return n;
  }
  function add(n, c) {

      .then(function (ok) { if (ok) act('POST', '/drain', 'Queue drained', { include_delayed: cb.checked }); });
  }
  function obliterateDialog() {
    var inp = el('input', { id: 'oblName', autocomplete: 'off', 'aria-describedby': 'confirmText' });
    var force = el('input', { type: 'checkbox', id: 'oblForce' });
    confirmIt('Delete queue ' + S.queue + '?', 'Every job and key of this queue is deleted for good. Type the queue name to confirm.', 'Delete queue',
      [el('div', { class: 'field' }, el('label', { for: 'oblName' }, 'Queue name'), inp), el('label', { class: 'check' }, force, 'Even if jobs are running')],
      function () { return inp.value === S.queue; })
      .then(function (ok) {
        if (!ok) return;
        api('DELETE', '/queues/' + enc(S.queue) + (force.checked ? '?force=true' : '')).then(function () {
          toast('Queue deleted'); S.queue = null; S.page = null; S.job = null; writeHash(); loadQueues().then(function () { renderAll(); load(); followEvents(); });
        }, fail);
      });
  }
  function addDialog() {
    var dlg = $('addDlg'); $('addErr').textContent = ''; S.lastFocus = document.activeElement;
    dlg.onclose = function () {
      if (dlg.returnValue !== 'ok') { restoreFocus(); return; }
      var data, opts;
      try { data = JSON.parse($('addData').value || 'null'); opts = $('addOpts').value.trim() ? JSON.parse($('addOpts').value) : {}; }
      catch (e) { $('addErr').textContent = 'Not valid JSON: ' + e.message; dlg.showModal(); return; }
      var body = { data: data, opts: opts }; if ($('addName').value.trim()) body.name = $('addName').value.trim();
      api('POST', '/queues/' + enc(S.queue) + '/jobs', body).then(function (r) { toast('Job ' + r.id + ' added'); loadQueues(); load(); restoreFocus(); },
        function (e) { $('addErr').textContent = e.message; dlg.showModal(); });
    };
    dlg.showModal();
  }
  function restoreFocus() { if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus(); }

  function confirmIt(title, text, okLabel, extra, valid) {
    var dlg = $('confirmDlg'); S.lastFocus = document.activeElement;
    $('confirmTitle').textContent = title; $('confirmText').textContent = text; $('confirmOk').textContent = okLabel || 'Confirm';
    var ex = clear($('confirmExtra')); add(ex, extra || []);
    var ok = $('confirmOk'); ok.disabled = !!valid && !valid();
    var check = function () { if (valid) ok.disabled = !valid(); };
    ex.addEventListener('input', check);
    return new Promise(function (resolve) {
      dlg.onclose = function () { ex.removeEventListener('input', check); restoreFocus(); resolve(dlg.returnValue === 'ok' && (!valid || valid())); };
      dlg.returnValue = ''; dlg.showModal();
      var first = ex.querySelector('input, select'); if (first) first.focus();
    });
  }

  // --------------------------------------------------------------- drawer
  function openJob(queue, id) {
    S.lastFocus = document.activeElement; S.job = { queue: queue, id: String(id) }; writeHash(); syncDrawer();
  }
  function closeJob() { S.job = null; S.jobData = null; writeHash(); syncDrawer(); restoreFocus(); }
  var drawerSeq = 0;
  function syncDrawer() {
    var host = clear($('drawerHost'));
    if (!S.job) { document.body.style.overflow = ''; return; }
    var j = S.job, seq = ++drawerSeq;
    var body = el('div', { class: 'body' }, el('div', { class: 'empty', role: 'status', text: 'Loading job…' }));
    var title = el('h2', { id: 'drawerTitle', class: 'mono', text: j.id });
    var drawer = el('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'drawerTitle', tabindex: '-1', onkeydown: trapFocus },
      el('header', null, el('div', { class: 't' }, el('div', { class: 'muted', text: 'Job · ' + j.queue }), title),
        el('button', { class: 'btn icon ghost', 'aria-label': 'Copy job id', onclick: function () { copy(j.id); } }, icon('copy')),
        el('button', { class: 'btn icon ghost', 'aria-label': 'Close (Esc)', id: 'drawerClose', onclick: closeJob }, icon('close'))),
      body);
    host.append(el('div', { class: 'scrim', onclick: closeJob }), drawer);
    if (matchMedia('(max-width: 640px)').matches) document.body.style.overflow = 'hidden';
    $('drawerClose').focus();
    loadJob(seq, body);
  }
  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    var f = this.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function copy(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, function () { toast('Copy failed', true); });
  }
  function loadJob(seq, body) {
    var j = S.job, qp = '/queues/' + enc(j.queue) + '/jobs/' + enc(j.id);
    Promise.all([api('GET', qp), api('GET', qp + '/logs?order=desc&limit=50').catch(function () { return { logs: [] }; })])
      .then(function (r) {
        if (seq !== drawerSeq) return;
        S.jobData = r[0];
        renderJob(body, r[0], r[1].logs, null);
        // The flow section only for jobs that are part of a flow.
        api('GET', qp + '/flow?depth=3').then(function (f) {
          if (seq === drawerSeq && (f.children.length || r[0].parent)) renderJob(body, r[0], r[1].logs, f);
        }, function () {});
      }, function (e) {
        if (seq !== drawerSeq) return;
        clear(body).append(el('div', { class: 'empty', role: 'alert' }, el('strong', { text: e.status === 404 ? 'Job not found' : 'Could not load the job' }),
          el('span', { text: e.status === 404 ? 'It may have been removed, or its retention cleaned it up.' : e.message })));
      });
  }
  function renderJob(body, job, logs, flow) {
    clear(body);
    var acts = el('div', { class: 'acts' });
    if (isAdmin()) {
      if (job.state === 'failed') acts.append(el('button', { class: 'btn primary', onclick: function () { jobAct('POST', '/retry', 'Job queued for retry'); } }, 'Retry'));
      if (job.state === 'delayed') acts.append(el('button', { class: 'btn primary', onclick: function () { jobAct('POST', '/promote', 'Job will run now'); } }, 'Run now'));
      acts.append(el('button', { class: 'btn danger', disabled: job.locked, title: job.locked ? 'A worker is running it' : null,
        onclick: function () {
          confirmIt('Remove job ' + job.id + '?', 'The job, its logs and its flow tree are deleted.', 'Remove').then(function (ok) {
            if (ok) jobAct('DELETE', '', 'Job removed').then(function () { closeJob(); });
          });
        } }, 'Remove'));
    }
    var started = job.processed_on_ms, finished = job.finished_on_ms;
    var kv = el('dl', { class: 'kv' });
    function row(k, v) { if (v === '' || v == null) return; kv.append(el('dt', { text: k }), el('dd', null, v)); }
    row('State', stateBadge(job.state));
    row('Name', job.name);
    row('Attempts', job.attempts_made + ' of ' + job.attempts_total);
    if (job.opts && job.opts.priority) row('Priority', String(job.opts.priority));
    row('Added', el('span', { title: when(job.timestamp_ms), text: when(job.timestamp_ms) + ' (' + ago(job.timestamp_ms) + ')' }));
    if (started) row(finished ? 'Started' : 'Running since', el('span', { title: when(started), text: when(started) + ' (' + ago(started) + ')' }));
    if (finished) row('Finished', el('span', { title: when(finished), text: when(finished) }));
    if (started && finished) row('Took', dur(finished - started));
    if (started) row('Waited', dur(started - job.timestamp_ms));
    if (job.locked) row('Worker', 'holds the lock');
    if (job.parent) row('Parent', el('button', { class: 'btn ghost', style: 'min-height: 0; padding: 0 4px', onclick: function () { openJob(job.parent.queue, job.parent.id); } }, job.parent.queue + ' / ' + job.parent.id));
    body.append(acts.childNodes.length ? acts : null, el('section', null, el('h3', null, 'Overview'), kv));
    if (job.progress != null) body.append(el('section', null, el('h3', null, 'Progress'), typeof job.progress === 'number' ? progress(job.progress) : el('pre', { class: 'json', text: pretty(job.progress) })));
    if (job.state === 'failed' || job.failed_reason || job.stacktrace.length) {
      var ol = el('ul', { 'aria-label': 'Failed attempts, newest first' }); job.stacktrace.slice().reverse().forEach(function (s) { ol.append(el('li', { text: s })); });
      body.append(el('section', null, el('h3', null, 'Failure'), el('div', { class: 'failure' }, el('p', { text: job.failed_reason || 'Failed' }), job.stacktrace.length ? ol : null)));
    }
    if (job.return_value != null) body.append(el('section', null, el('h3', null, 'Return value'), el('pre', { class: 'json', text: pretty(job.return_value) })));
    body.append(el('section', null, el('h3', null, 'Data'), el('pre', { class: 'json', text: pretty(job.data) })));
    if (flow) body.append(el('section', null, el('h3', null, 'Flow'), el('ul', { class: 'tree' }, flowNode(flow, job))));
    var ul = el('ul', { class: 'logs', 'aria-label': 'Log lines, newest first' });
    logs.forEach(function (l) { ul.append(el('li', { text: l })); });
    body.append(el('section', null, el('h3', null, 'Logs'), logs.length ? ul : el('p', { class: 'muted', style: 'margin: 0', text: 'No log lines.' })));
    body.append(el('details', null, el('summary', { class: 'muted', style: 'cursor: pointer' }, 'Options'), el('pre', { class: 'json', style: 'margin-top: 6px', text: pretty(job.opts) })));
  }
  function flowNode(n, job) {
    var me = n.queue === job.queue && n.id === job.id;
    var li = el('li', null, el('button', { class: 'node' + (me ? ' me' : ''), 'aria-current': me ? 'true' : null, onclick: function () { if (!me) openJob(n.queue, n.id); } },
      stateBadge(n.state), el('span', { class: 'mono', text: n.id }), el('span', { text: n.name || '(gone)' }),
      n.queue !== job.queue ? el('span', { class: 'muted', text: '· ' + n.queue }) : null,
      n.dependency && n.dependency !== 'pending' ? el('span', { class: 'muted', text: '· ' + n.dependency }) : null));
    if (n.children.length) { var ul = el('ul', { class: 'tree' }); n.children.forEach(function (c) { ul.append(flowNode(c, job)); }); li.append(ul); }
    if (n.truncated) li.append(el('div', { class: 'muted', style: 'padding-left: 24px', text: '…more' }));
    return li;
  }
  function jobAct(method, suffix, done) {
    var j = S.job;
    return api(method, '/queues/' + enc(j.queue) + '/jobs/' + enc(j.id) + suffix).then(function () { toast(done); loadQueues(); load(); if (method !== 'DELETE') syncDrawer(); }, function (e) { fail(e); throw e; });
  }

  // --------------------------------------------------------------- events
  var refreshTimer = null;
  function scheduleRefresh() {
    if (refreshTimer) return;
    refreshTimer = setTimeout(function () { refreshTimer = null; load(); }, 700);
  }
  function setLive(state) {
    S.live = state; $('live').dataset.state = state;
    $('liveText').textContent = state === 'live' ? 'Live' : state === 'polling' ? 'Polling' : 'Offline';
  }
  function followEvents() {
    if (S.events) S.events.abort();
    var queue = S.queue; if (!queue || !window.ReadableStream || !window.TextDecoderStream) { setLive('polling'); return; }
    var ctl = new AbortController(); S.events = ctl;
    var last = null;
    (function loop() {
      if (ctl.signal.aborted) return;
      var h = headers(false); h.accept = 'text/event-stream'; if (last) h['last-event-id'] = last;
      fetch(S.base + '/v1/queues/' + enc(queue) + '/events', { headers: h, signal: ctl.signal }).then(function (res) {
        if (res.status === 401) { askToken(); throw new Error('unauthorized'); }
        if (!res.ok || !res.body) throw new Error('events ' + res.status);
        setLive('live');
        var reader = res.body.pipeThrough(new TextDecoderStream()).getReader(), buf = '';
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) throw new Error('closed');
            buf += r.value;
            var i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              var frame = buf.slice(0, i); buf = buf.slice(i + 2);
              var ev = {}; frame.split('\n').forEach(function (line) { var c = line.indexOf(': '); if (c > 0) ev[line.slice(0, c)] = line.slice(c + 2); });
              if (ev.id) last = ev.id;
              if (ev.event) onEvent(ev);
            }
            return pump();
          });
        }
        return pump();
      }).catch(function () {
        if (ctl.signal.aborted) return;
        setLive('polling');
        sleep(3000).then(loop);
      });
    })();
  }
  function onEvent(ev) {
    scheduleRefresh();
    if (S.job && S.job.queue === S.queue && S.jobData) {
      try { var d = JSON.parse(ev.data); if (d.id === S.job.id) jobRefresh(); } catch (e) { /* not JSON */ }
    }
  }
  var jobRefreshTimer = null;
  function jobRefresh() {
    if (jobRefreshTimer) return;
    jobRefreshTimer = setTimeout(function () { jobRefreshTimer = null; var b = document.querySelector('.drawer .body'); if (b && S.job) loadJob(drawerSeq, b); }, 400);
  }
  setInterval(function () {
    if (document.hidden) return;
    if (S.live !== 'live') load();
    loadQueues();
  }, 5000);

  // ----------------------------------------------------------------- auth
  function askToken() {
    var dlg = $('tokenDlg'); if (dlg.open) return;
    $('tokenIn').value = ''; $('tokenClear').hidden = !S.token;
    dlg.onclose = function () {
      if (dlg.returnValue === 'ok' && $('tokenIn').value.trim()) {
        S.token = $('tokenIn').value.trim();
        write('session', 'oxn.token', S.token); write('local', 'oxn.token', $('tokenRemember').checked ? S.token : null);
        start();
      } else if (dlg.returnValue === 'clear') {
        S.token = null; write('session', 'oxn.token', null); write('local', 'oxn.token', null); S.access = null; start();
      }
    };
    dlg.showModal();
  }

  // ---------------------------------------------------------------- theme
  var THEMES = ['auto', 'light', 'dark'];
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    var b = clear($('themeBtn')); b.append(icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto'));
    b.setAttribute('aria-label', 'Theme: ' + t + ' (change)');
  }

  // -------------------------------------------------------------- startup
  function start() {
    return api('GET', '/whoami').then(function (w) { S.access = w.access; }, function (e) { S.access = null; if (e.status !== 401) fail(e); })
      .then(loadQueues).then(function () { renderAll(); load(); syncDrawer(); followEvents(); });
  }
  $('sideToggle').append(icon('menu'));
  $('refreshBtn').append(icon('refresh'));
  $('keyBtn').append(icon('key'));
  $('sideToggle').addEventListener('click', function () {
    var lay = $('layout'), wide = matchMedia('(min-width: 900px)').matches;
    setSide(wide ? lay.classList.contains('collapsed') : !lay.classList.contains('open'));
  });
  $('qpick').addEventListener('click', function () { setSide(!$('layout').classList.contains('open')); });
  $('refreshBtn').addEventListener('click', function () { loadQueues(); load(); });
  $('keyBtn').addEventListener('click', askToken);
  var theme = read('local', 'oxn.theme') || 'auto'; applyTheme(theme);
  $('themeBtn').addEventListener('click', function () { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; write('local', 'oxn.theme', theme); applyTheme(theme); });
  $('qfilter').addEventListener('input', function (e) { S.filter = e.target.value; renderQueues(); });
  S.limit = parseInt(read('local', 'oxn.limit') || '25', 10) || 25;
  document.addEventListener('keydown', function (e) {
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (e.key === 'Escape') {
      if (document.querySelector('dialog[open]')) return;
      if (S.job) { e.preventDefault(); closeJob(); return; }
      if ($('layout').classList.contains('open')) { setSide(false); $('sideToggle').focus(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('dialog[open]')) return;
    if (e.key === '/') { var s = $('jobSearch'); if (s) { e.preventDefault(); s.focus(); } }
    else if (e.key === 'r') { loadQueues(); load(); }
    else if ((e.key === 'j' || e.key === 'k') && S.page && S.page.jobs.length && !S.job) {
      S.sel = Math.max(0, Math.min(S.page.jobs.length - 1, S.sel + (e.key === 'j' ? 1 : -1)));
      renderList(); var rows = document.querySelectorAll('.jobs tbody tr'); if (rows[S.sel]) rows[S.sel].focus();
    }
  });
  matchMedia('(min-width: 900px)').addEventListener('change', function () { $('layout').classList.remove('open', 'collapsed'); setSide(matchMedia('(min-width: 900px)').matches); });
  readHash();
  setSide(matchMedia('(min-width: 900px)').matches);
  start();
})();
</script>
</body>
</html>

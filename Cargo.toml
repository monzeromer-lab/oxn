[package]
name = "oxn"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Redis-backed async job queue for Rust: typed jobs, flows, distributed schedulers, rate limits, metrics, an HTTP API and a web dashboard."
license = "MIT OR Apache-2.0"
repository = "https://github.com/monzeromer-lab/oxn"
readme = "README.md"
keywords = ["queue", "redis", "jobs", "async", "tokio"]
categories = ["asynchronous", "database"]
# The published crate: the library, its examples and docs. The workspace's
# test kit, load harness, browser tests and scripts stay in the repo.
include = [
    "/src/**/*",
    "/build.rs",
    "/examples/**/*",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/docs/MIGRATION-0.3.md",
]

[workspace]
members = [".", "testkit", "loadtest"]

# Building this repo only — profiles in a library's manifest never apply to
# crates that depend on it. Full debug info made every integration-test
# binary ~140 MB; line tables keep file:line in backtraces at ~38 MB.
[profile.dev]
debug = "line-tables-only"

[features]
default = ["redis-backend"]

# Backends
redis-backend = ["dep:redis", "dep:deadpool-redis"]

# TLS for the Redis backend (`rediss://` URLs).
# `tls` uses rustls + webpki-roots — pure-Rust, recommended.
# `tls-native` uses native-tls (OpenSSL/SChannel/Security.framework).
# Pick one. Both opt-in.
tls = [
    "redis-backend",
    "redis/tokio-rustls-comp",
    "redis/tls-rustls-webpki-roots",
    "deadpool-redis/rt_tokio_1",
]
tls-native = [
    "redis-backend",
    "redis/tokio-native-tls-comp",
    "deadpool-redis/rt_tokio_1",
]

# Optional subsystems
scheduler = ["dep:cron", "dep:chrono"]
flow = []
metrics = ["dep:metrics"]

# HTTP API (`oxn::api`): the framework-neutral core, and its adapters.
api = []
api-axum = ["api", "dep:axum", "dep:tower", "dep:tower-http"]
api-actix = ["api", "dep:actix-web"]

# Dashboards: the API plus the bundled UI (mutually compatible, but most
# users will pick one)
dashboard = ["api"]
dashboard-axum = ["dashboard", "api-axum"]
dashboard-actix = ["dashboard", "api-actix"]

# Convenience bundle
full = [
    "redis-backend",
    "tls",
    "scheduler",
    "flow",
    "metrics",
    "dashboard-axum",
]

[dependencies]
tokio = { version = "1.40", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
pin-project-lite = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
tracing = "0.1"
bytes = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
async-trait = "0.1"

# Redis backend
redis = { version = "0.27", default-features = false, optional = true, features = [
    "tokio-comp",
    "script",
    "streams",
    "connection-manager",
    "aio",
] }
deadpool-redis = { version = "0.18", optional = true }

# Scheduler
cron = { version = "0.12", optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = [
    "serde",
    "clock",
] }

# Metrics
metrics = { version = "0.24", optional = true }

# Dashboard — axum
axum = { version = "0.7", optional = true, default-features = false, features = [
    "tokio",
    "http1",
    "json",
    "query",
    "matched-path",
] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace"] }

# Dashboard — actix
actix-web = { version = "4", optional = true, default-features = false, features = [
    "macros",
] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-util = "0.7"
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
jsonschema = { version = "0.49", default-features = false }
oxn-testkit = { path = "testkit" }

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["redis-backend"]

[[example]]
name = "delayed"
path = "examples/delayed.rs"
required-features = ["redis-backend"]

[[example]]
name = "api_axum"
path = "examples/api_axum.rs"
required-features = ["redis-backend", "api-axum"]

[[example]]
name = "api_actix"
path = "examples/api_actix.rs"
required-features = ["redis-backend", "api-actix"]

[[example]]
name = "flow"
path = "examples/flow.rs"
required-features = ["redis-backend", "flow"]

[[example]]
name = "graceful_shutdown"
path = "examples/graceful_shutdown.rs"
required-features = ["redis-backend"]

[[example]]
name = "rate_limit"
path = "examples/rate_limit.rs"
required-features = ["redis-backend"]

[[example]]
name = "e2e_dashboard"
path = "examples/e2e_dashboard.rs"
required-features = ["redis-backend", "dashboard-axum", "flow", "scheduler"]

[[example]]
name = "dashboard_axum"
path = "examples/dashboard_axum.rs"
required-features = ["redis-backend", "dashboard-axum"]

[[example]]
name = "diag_managed_redis"
path = "examples/diag_managed_redis.rs"
required-features = ["tls"]

[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

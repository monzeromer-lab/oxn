name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt · clippy · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy (feature matrix)
        run: |
          cargo clippy -p oxn --lib --no-default-features -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features dashboard-actix -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc -p oxn --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p oxn --all-features

  test:
    name: unit · integration · doc tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p oxn --lib --no-default-features
      - run: cargo test --workspace --features "scheduler,flow,metrics,dashboard-axum,dashboard-actix"
      - run: cargo test -p oxn --features dashboard-actix --lib
      - name: timing tests (alone, on an idle Redis)
        run: cargo test --test it -- --ignored --test-threads=1
      - name: Upload timeline reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-timelines
          path: target/oxn-reports/
          if-no-files-found: ignore

  load-smoke:
    name: load smoke (ledger + invariant gate)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p oxn-load --release
      - name: smoke
        run: target/release/oxn-load run --redis redis://127.0.0.1:6379 --scenario smoke
      - name: latency (pickup p99 < 50ms at the default drain_delay)
        run: target/release/oxn-load run --redis redis://127.0.0.1:6379 --scenario latency --duration 20s
      - name: flow fan-out (every parent once, after its children)
        run: >-
          target/release/oxn-load flow --redis redis://127.0.0.1:6379 --flows 1000 --children 5
          --fail-parent-rate 0.1 --ignore-rate 0.1 --retry-rate 0.1 --dynamic-rate 0.1
          --restart-every-s 2 --label ci
      - name: schedulers (one run per tick across instances)
        run: >-
          target/release/oxn-load schedule --redis redis://127.0.0.1:6379 --schedulers 20
          --instances 5 --every-ms 200 --duration-s 8 --restart-every-s 3 --label ci
      - name: through the HTTP API (API and workers in separate processes)
        run: >-
          target/release/oxn-load run --redis redis://127.0.0.1:6379 --scenario smoke --jobs 10000
          --rate 2000 --bulk 20 --processes true --workers 3 --via-api --api-readers 4 --label ci-api
      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-reports
          path: target/oxn-reports/load/
          if-no-files-found: ignore

[package]
name = "oxn-testkit"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test harness for oxn: step recorder, Redis state snapshots, invariant checker and timeline reports."

[dependencies]
oxn = { path = "..", default-features = false, features = ["redis-backend"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
